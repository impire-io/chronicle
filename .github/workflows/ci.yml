name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" && echo "$unformatted" && exit 1
          fi

      - name: Tidy
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      # The release depends on these cross-compiles and no macOS developer
      # runs them locally: the guest half of the microsandbox backend.
      - name: Build guest workloads (linux amd64 + arm64)
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/chronicle-workload
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/chronicle-workload

      - name: Test
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  # Contributions are accepted under the Developer Certificate of Origin
  # (chronicle-hq decision 0031; CONTRIBUTING.md): every commit a pull
  # request brings carries the author's Signed-off-by trailer.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        run: |
          missing=0
          for sha in $(git rev-list "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "no Signed-off-by on $(git log -1 --format='%h %s' "$sha")"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "add the trailer with: git commit -s (see CONTRIBUTING.md)"
            exit 1
          fi
