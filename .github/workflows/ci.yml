name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" && echo "$unformatted" && exit 1
          fi

      - name: Tidy
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      # The release depends on these cross-compiles and no macOS developer
      # runs them locally: the guest half of the microsandbox backend.
      - name: Build guest workloads (linux amd64 + arm64)
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/chronicle-workload
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/chronicle-workload

      - name: Test
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
