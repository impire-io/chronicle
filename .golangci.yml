version: "2"

linters:
  # Default set (errcheck, govet, ineffassign, staticcheck, unused) plus a few.
  enable:
    - revive
    - misspell
    - unconvert
    - depguard
  settings:
    depguard:
      # The tenant plane's seams (chronicle-hq/02-DESIGN/11-the-two-forms.md):
      # contract is the one shared leaf; client speaks contract only; the
      # node and the index kinds stand alone and share through contract
      # and client types, never through each other; foldcore and registry
      # are shared leaves every projection and API-serving component may
      # use; devdir is the tiny seam the adapters share with the quick
      # start; up composes; cli adapts. Every package here is public
      # because the managed service (chronicle-service) composes them — the
      # dependency runs one way, and nothing here knows that repo exists.
      rules:
        contract-is-a-leaf:
          files: ["**/contract/*.go", "!$test"]
          deny:
            - pkg: github.com/impire-io/chronicle
              desc: the contract package imports no other chronicle package
        client-speaks-contract-only:
          files: ["**/client/*.go", "!$test"]
          deny:
            - pkg: github.com/impire-io/chronicle/node
              desc: the client package is the wire surface; it never reaches into a service
            - pkg: github.com/impire-io/chronicle/index
              desc: the client package is the wire surface; it never reaches into a service
            - pkg: github.com/impire-io/chronicle/foldcore
              desc: the client package is the wire surface; it never reaches into a service
            - pkg: github.com/impire-io/chronicle/registry
              desc: the client package is the wire surface; it never reaches into a service
            - pkg: github.com/impire-io/chronicle/up
              desc: the client never imports the composition
            - pkg: "github.com/impire-io/chronicle/cli{,/**}"
              desc: the client never imports the adapters
            - pkg: github.com/impire-io/chronicle/devdir
              desc: the client knows no data-dir conventions
        node-stands-alone:
          files: ["**/node/**", "!$test"]
          deny:
            - pkg: github.com/impire-io/chronicle/index
              desc: services never import each other; share through contract and client types
            - pkg: github.com/impire-io/chronicle/up
              desc: services never import the composition
            - pkg: "github.com/impire-io/chronicle/cli{,/**}"
              desc: services never import the adapters
            - pkg: github.com/impire-io/chronicle/devdir
              desc: services know no data-dir conventions; their mains do the connecting
        index-kinds-stand-alone:
          files: ["**/index/**", "!$test"]
          deny:
            - pkg: github.com/impire-io/chronicle/node
              desc: services never import each other; share through contract and client types
            - pkg: github.com/impire-io/chronicle/up
              desc: services never import the composition
            - pkg: "github.com/impire-io/chronicle/cli{,/**}"
              desc: services never import the adapters
            - pkg: github.com/impire-io/chronicle/devdir
              desc: services know no data-dir conventions; their mains do the connecting
        foldcore-is-a-shared-leaf:
          files: ["**/foldcore/*.go", "!$test"]
          deny:
            - pkg: github.com/impire-io/chronicle/node
              desc: the shared judgment imports no service
            - pkg: github.com/impire-io/chronicle/index
              desc: the shared judgment imports no service
            - pkg: github.com/impire-io/chronicle/up
              desc: the shared judgment never imports the composition
            - pkg: "github.com/impire-io/chronicle/cli{,/**}"
              desc: the shared judgment never imports the adapters
        registry-is-a-shared-leaf:
          files: ["**/registry/*.go", "!$test"]
          deny:
            - pkg: github.com/impire-io/chronicle/node
              desc: the shared role check imports no service
            - pkg: github.com/impire-io/chronicle/index
              desc: the shared role check imports no service
            - pkg: github.com/impire-io/chronicle/up
              desc: the shared role check never imports the composition
            - pkg: "github.com/impire-io/chronicle/cli{,/**}"
              desc: the shared role check never imports the adapters
        devdir-imports-nothing:
          files: ["**/devdir/*.go", "!$test"]
          deny:
            - pkg: github.com/impire-io/chronicle
              desc: devdir declares conventions; it imports no chronicle package
        guestnet-imports-nothing:
          files: ["**/guestnet/*.go", "!$test"]
          deny:
            - pkg: github.com/impire-io/chronicle
              desc: guestnet resolves a guest's host; it imports no chronicle package
        up-composes-the-tenant-plane:
          files: ["**/up/*.go", "!$test"]
          deny:
            - pkg: github.com/impire-io/chronicle/client
              desc: the composition starts services; speaking to them is a client's job
            - pkg: "github.com/impire-io/chronicle/cli{,/**}"
              desc: the composition never imports the adapters
        adapters-speak-client-only:
          files: ["**/cli/*.go", "!$test"]
          deny:
            - pkg: github.com/impire-io/chronicle/node
              desc: adapters reach the tenant plane through the client package, never a service's internals
            - pkg: github.com/impire-io/chronicle/index
              desc: adapters reach the tenant plane through the client package, never a service's internals
            - pkg: github.com/impire-io/chronicle/foldcore
              desc: adapters reach the tenant plane through the client package
            - pkg: github.com/impire-io/chronicle/registry
              desc: adapters reach the tenant plane through the client package
            - pkg: github.com/impire-io/chronicle/up
              desc: adapters stay clients; the composition is dispatched from cmd/chronicle
        cmd-chronicle-runs-cli-and-composition:
          files: ["**/cmd/chronicle/*.go"]
          deny:
            - pkg: github.com/impire-io/chronicle/node
              desc: cmd/chronicle reaches the tenant plane only through up and cli
            - pkg: github.com/impire-io/chronicle/index
              desc: cmd/chronicle reaches the tenant plane only through up and cli
        cmd-chronicle-node-runs-its-service:
          files: ["**/cmd/chronicle-node/*.go"]
          deny:
            - pkg: github.com/impire-io/chronicle/index
              desc: this main runs the node and nothing else
            - pkg: github.com/impire-io/chronicle/up
              desc: this main runs the node and nothing else
            - pkg: "github.com/impire-io/chronicle/cli{,/**}"
              desc: this main runs the node and nothing else
        cmd-chronicle-workload-runs-one-kind:
          files: ["**/cmd/chronicle-workload/*.go"]
          deny:
            - pkg: github.com/impire-io/chronicle/up
              desc: this main runs one placement kind and nothing else
            - pkg: "github.com/impire-io/chronicle/cli{,/**}"
              desc: this main runs one placement kind and nothing else
    errcheck:
      # Writing to stdout/stderr and ignoring the (near-impossible) error is idiomatic.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/impire-io/chronicle
